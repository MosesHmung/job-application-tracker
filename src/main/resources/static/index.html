<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<div class="container">
    <header>
        <h1>Job Application Tracker</h1>
    </header>
    <section class="stats">
        <div class="card">
            <p>Applied</p>
            <h2 id="applied">0</h2>
        </div>
        <div class="card">
            <p>Interviews</p>
            <h2 id="interviews">0</h2>
        </div>
        <div class="card">
            <p>Offers</p>
            <h2 id="offers">0</h2>
        </div>
        <div class="card">
            <p>Watching</p>
            <h2 id="watching">0</h2>
        </div>
    </section>
    <section class="toolbar">
        <button id="addButton" onclick="openModal()">
            + Add Application
        </button>
    </section>
    <section class="application-section">
        <h2>Your Applications</h2>

        <div class="applications-layout">

            <div class="application-container">
                <table class="application-table">
                    <thead>
                    <tr>
                        <th>Company</th>
                        <th>Job Title</th>
                        <th>Status</th>
                        <th>Date Applied</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody id="applicationList">
                    </tbody>
                </table>
            </div>

            <button class="calendar-toggle" onclick="toggleCalendar()">
                📅
            </button>

            <aside id="calendarPanel" class="calendar-panel hidden">
                <div class="calendar-header">
                    <button onclick="previousWeek()">‹</button>
                    <h3 id="weekTitle">This Week</h3>
                    <button onclick="nextWeek()">›</button>
                    <button onclick="toggleCalendar()">×</button>
                </div>

                <div class="week-calendar">
                    <div class="week-days-header">
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                        <span>Sun</span>
                    </div>

                    <div id="weekGrid" class="week-grid">
                        <!-- JS fills this -->
                    </div>
                </div>

                <button class="expand-calendar-button" onclick="openFullCalendar()">
                    Expand Calendar
                </button>
            </aside>

        </div>
    </section>
</div>
<div id="applicationModal" class="modal hidden">

    <div class="modal-content">

        <h2 id="modalTitle">Add Application</h2>

        <label>Company</label>
        <input id="companyInput" type="text">

        <label>Job Title</label>
        <input id="jobTitleInput" type="text">

        <label>Status</label>
        <select id="statusInput">
            <option value="WATCHING">Watching</option>
            <option value="APPLIED">Applied</option>
            <option value="PHONE_SCREEN">Phone Screen</option>
            <option value="INTERVIEWING">Interviewing</option>
            <option value="OFFER">Offer</option>
            <option value="REJECTED">Rejected</option>
            <option value="WITHDRAWN">Withdrawn</option>
        </select>

        <label>Date Applied</label>
        <input id="dateInput" type="date" min="1900-01-01" max="9999-12-31">>

        <label>Salary Min</label>
        <input id="salaryMinInput" type="number">

        <label>Salary Max</label>
        <input id="salaryMaxInput" type="number">

        <label>Notes</label>
        <textarea id="notesInput"></textarea>

        <div class="modal-buttons">
            <button onclick="closeModal()">Cancel</button>
            <button onclick="saveApplication()">Save</button>
        </div>

    </div>

</div>
<div id="deleteModal" class="modal hidden">

    <div class="modal-content">

        <h2>Delete Application</h2>

        <p id="deleteMessage">
            Are you sure you want to delete this application?
        </p>

        <div class="modal-buttons">
            <button onclick="closeDeleteModal()">Cancel</button>
            <button onclick="confirmDelete()">Delete</button>
        </div>

    </div>

</div>
<script src="app.js?v=2"></script>
</body>
</html>
